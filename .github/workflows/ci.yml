name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -ldflags "-w -s" -o /tmp/tf-api ./cmd/tf-api

      - name: test
        run: go test -race -count=1 ./...

  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查错误码 i18n 完整性
        run: |
          set -e
          missing=0
          keys=$(grep -oP '(?<=: ")[a-z][a-z0-9-]+(?=",)' internal/app/errors/code.go | sort -u)
          for k in $keys; do
            for f in configs/i18n/*.yaml; do
              if ! grep -q "^${k}:" "$f"; then
                echo "MISSING: $k 在 $f"
                missing=1
              fi
            done
          done
          if [ "$missing" = "1" ]; then
            echo "错误码对应的 i18n key 缺失，请补齐"
            exit 1
          fi
          echo "i18n check passed"
